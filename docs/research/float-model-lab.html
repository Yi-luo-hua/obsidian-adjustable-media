<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Adjustable Media 浮动模型实验</title><style>
*{box-sizing:border-box} body{margin:0;padding:28px;background:#f6f5f1;color:#202a34;font:16px/1.5 system-ui,'Microsoft YaHei',sans-serif} h1{font-size:26px;margin:0 0 10px} p{max-width:950px}button{padding:9px 15px;border:1px solid #9ba8b0;background:white;border-radius:6px;cursor:pointer;margin:0 8px 12px 0}button.active{background:#244758;color:white}.note{color:#657079;font-size:14px} .flow{display:flow-root;width:1000px;max-width:100%;min-height:430px;line-height:24px;font-size:16px;background:white;border:1px solid #a9b5bd;padding:0;margin-top:15px} .anchor{height:0}.vml-layout{width:35%;height:120px;padding:8px;border:1px solid #244758;background:#b7d8df;color:#162d33}.vml-layout--wrap-left{clear:left;float:left;margin:0.25em 1.5em 0.5em 0}.vml-layout--wrap-right{clear:right;float:right;margin:0.25em 0 0.5em 1.5em}.vml-wrap-skip{height:calc(var(--vml-skip,0)*1lh);width:0}.vml-wrap-skip--left{float:left}.vml-wrap-skip--right{float:right}.text{margin:0}.result{padding:12px;background:#e3e9e8;font:14px/1.7 ui-monospace,monospace;white-space:pre-wrap;max-width:1000px}footer{margin-top:14px;color:#657079;font-size:13px}
</style><h1>并列与拖动：CSS 浮动约束实验</h1><p>从当前仓库复制 float、clear、margin 和 skip 的核心样式，在零高度锚点中验证浏览器约束。用于验证底层机制；不替代 Obsidian 中的真实拖动验收。</p><div id="buttons"><button data-case="before">三块初始顺序 A → B → C</button><button data-case="up">C 向上拖，现有规划 A → C → B</button><button data-case="down">A 向下拖，现有规划 B → A → C</button><button data-case="wide">左右各宽 60%，预览仍假定并列</button></div><div id="result" class="result"></div><div id="flow" class="flow"></div><footer>行高 24px，块高 120px。浅色盒子是真实 CSS 结果；结果栏中的 predicted 是当前 visualWrapSkip() 给出的行数 × 行高再加上外边距 4px。</footer><script>
const cases={before:[['A','left',2,2],['B','right',2,4],['C','left',2,6]],up:[['A','left',2,2],['C','left',1,1],['B','right',4,5]],down:[['B','right',5,5],['A','left',3,8],['C','left',6,6]],wide:[['A','left',0,0],['B','right',0,0]]};
function render(key){const flow=document.getElementById('flow');flow.replaceChildren();for(const[name,side,effective,visual]of cases[key]){const anchor=document.createElement('div');anchor.className='anchor';if(effective){const bag=document.createElement('div');bag.className='vml-wrap-skip vml-wrap-skip--'+side;bag.style.setProperty('--vml-skip',effective);anchor.append(bag)}const box=document.createElement('div');box.className='vml-layout vml-layout--wrap-'+side;box.dataset.name=name;box.dataset.predicted=visual*24+4;box.textContent=name+' · '+side+' · visual skip '+visual;if(key==='wide')box.style.width='60%';anchor.append(box);flow.append(anchor)}const body=document.createElement('p');body.className='text';body.textContent=('正文在浮动旁边流动，块的源顺序与 clear 约束决定真实位置。 ').repeat(85);flow.append(body);document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.case===key));measure(key)}
function measure(key){const flow=document.getElementById('flow');const top=flow.getBoundingClientRect().top+flow.clientTop;window.lastResult={case:key,width:flow.clientWidth,boxes:[...flow.querySelectorAll('.vml-layout')].map(b=>({name:b.dataset.name,predicted:Number(b.dataset.predicted),actual:+(b.getBoundingClientRect().top-top).toFixed(2),height:b.getBoundingClientRect().height}))};document.getElementById('result').textContent=['case: '+key+' | width: '+flow.clientWidth+'px',...window.lastResult.boxes.map(b=>b.name+': 模型 '+b.predicted+'px → 实际 '+b.actual+'px | 高度 '+Math.round(b.height)+'px')].join('\n')}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.case)));window.addEventListener('resize',()=>measure(document.querySelector('button.active').dataset.case));render('before');
</script></html>
